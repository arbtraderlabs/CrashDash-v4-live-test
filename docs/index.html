<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CrashDash VNext local real-data application shell">
  <title>CrashDash | VNext research dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #131b31;
      --panel-raised: #19233d;
      --line: #2b3859;
      --text: #f3f6ff;
      --muted: #9ba8c4;
      --accent: #79a9ff;
      --accent-soft: #203c70;
      --green: #73d6a0;
      --amber: #f1c875;
      --purple: #bd9bff;
      --orange: #f3a26f;
      --close-watch: var(--green);
      --elevated: #f1c875;
      --high: #f3a26f;
      --extreme: #ff6b78;
      --cyan: #5fd7e6;
      --gold: #e0b75c;
      --teal: #10b981;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--bg); color: var(--text); }
    button, select, input { color: inherit; font: inherit; }
    a { color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .app-shell { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 56px; padding: 0 1.25rem; border-bottom: 1px solid rgba(155, 168, 196, .18); background: rgba(11, 16, 32, .92); }
    .brand { display: flex; align-items: center; gap: .6rem; font-weight: 750; letter-spacing: .01em; }
    .brand-mark { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(145deg, var(--accent), #6879e8); color: #091126; font-weight: 900; font-size: .85rem; }
    #build-status { margin: 0; color: var(--muted); font-size: .78rem; }
    .app-body { display: grid; grid-template-columns: minmax(180px, 220px) minmax(0, 1fr); min-height: 0; }
    .app-nav { display: flex; flex-direction: column; gap: .15rem; padding: 1rem .75rem; border-right: 1px solid rgba(155, 168, 196, .16); background: rgba(19, 27, 49, .55); }
    .nav-link { display: block; border: 1px solid transparent; border-radius: 8px; color: var(--muted); text-decoration: none; padding: .55rem .7rem; font-size: .88rem; }
    .nav-link:hover { background: rgba(121, 169, 255, .08); color: var(--text); }
    .nav-link.active { border-color: var(--accent-soft); background: var(--accent-soft); color: var(--text); font-weight: 650; }
    .app-main { min-width: 0; padding: 1.5rem clamp(1rem, 2vw, 2rem) 3rem; }
    #load-status { margin: 0 0 1rem; color: var(--muted); font-size: .82rem; }
    .view-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .view-heading h1 { margin: .25rem 0 0; font-size: clamp(1.35rem, 2.2vw, 1.9rem); letter-spacing: -.02em; }
    .view-heading h2 { margin: 0; font-size: 1.05rem; }
    .eyebrow { margin: 0; color: var(--muted); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .75rem; margin-bottom: 1.75rem; }
    .metric-card { padding: .9rem 1rem; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-raised); }
    .metric-label { margin: 0 0 .35rem; color: var(--muted); font-size: .76rem; }
    .metric-value { margin: 0; font-size: 1.6rem; font-weight: 750; }
    .briefing-copy { margin: .55rem 0 0; color: var(--muted); line-height: 1.45; }
    .today-all-link { align-self: end; white-space: nowrap; border: 1px solid var(--accent); border-radius: 8px; padding: .55rem .75rem; text-decoration: none; font-size: .78rem; font-weight: 650; }
    .featured-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: .9rem; margin: 0; padding: 0; list-style: none; }
    .featured-card { display: flex; min-height: 170px; flex-direction: column; padding: 1.1rem 1.15rem; border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 12px; background: var(--panel-raised); }
    .featured-heading { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
    .featured-kicker { display: block; margin-bottom: .25rem; color: var(--muted); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; }
    .featured-severity { color: var(--accent); font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-align: right; text-transform: uppercase; }
    .featured-company { margin: .25rem 0 0; color: var(--muted); font-size: .8rem; }
    .featured-orientation { margin: .45rem 0 0; color: var(--accent); font-size: .75rem; }
    .severity-close-watch .featured-severity, .dashboard-severity.severity-close-watch, .severity-close-watch .signal-state { color: var(--close-watch); }
    .severity-close-watch { border-left-color: var(--close-watch); }
    .severity-elevated .featured-severity, .dashboard-severity.severity-elevated, .severity-elevated .signal-state { color: var(--elevated); }
    .severity-elevated { border-left-color: var(--elevated); }
    .severity-high .featured-severity, .dashboard-severity.severity-high, .severity-high .signal-state { color: var(--high); }
    .severity-high { border-left-color: var(--high); }
    .severity-extreme-caution .featured-severity, .dashboard-severity.severity-extreme-caution, .severity-extreme-caution .signal-state { color: var(--extreme); }
    .severity-extreme-caution { border-left-color: var(--extreme); }
    .featured-meta { margin: .35rem 0 0; color: var(--muted); font-size: .8rem; }
    .featured-evidence { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .55rem; }
    .featured-link { display: inline-block; align-self: start; margin-top: auto; padding-top: 1rem; font-size: .84rem; font-weight: 700; }
    .research-workspace { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 1rem; align-items: start; }
    .signal-panel { position: sticky; top: 1rem; min-width: 0; }
    .detail-panel { min-width: 0; }
    .dashboard-panel { padding: 1rem; border: 1px solid var(--line); border-radius: 14px; background: rgba(19, 27, 49, .92); }
    .dashboard-heading { display: flex; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: .85rem; }
    .dashboard-heading h2 { margin: .3rem 0 0; font-size: 1.2rem; }
    .dashboard-count { margin: 0; color: var(--muted); font-size: .82rem; }
    .dashboard-controls { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; margin-bottom: .6rem; }
    .filter-group { display: flex; flex-wrap: wrap; gap: .35rem; }
    .filter-button, .filter-toggle, .sort-control { border: 1px solid var(--line); border-radius: 7px; background: #0e162a; color: var(--muted); font-size: .72rem; }
    .filter-button { cursor: pointer; padding: .4rem .55rem; }
    .filter-button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
    .filter-toggle, .sort-control { display: inline-flex; align-items: center; gap: .4rem; width: fit-content; padding: .35rem .5rem; }
    .sort-control select, .sort-control input { border: 0; background: transparent; padding: 0; color: var(--text); font-size: .72rem; }
    .search-future input, .future-filter select { color: var(--muted); }
    .toolbar-note { margin: 0 0 .6rem; color: var(--muted); font-size: .78rem; }
    .dashboard-list { max-height: calc(100vh - 320px); overflow-y: auto; border-top: 1px solid rgba(155, 168, 196, .14); }
    .dashboard-row { display: grid; grid-template-columns: minmax(0, 1.3fr) auto; gap: .2rem .6rem; width: 100%; border: 0; border-bottom: 1px solid rgba(155, 168, 196, .12); border-left: 3px solid transparent; background: transparent; color: var(--text); cursor: pointer; padding: .6rem .5rem .6rem .65rem; text-align: left; }
    .dashboard-row:hover, .dashboard-row.selected, .dashboard-row[aria-pressed="true"] { border-left-color: var(--accent); background: rgba(121, 169, 255, .08); }
    .dashboard-identity { display: flex; min-width: 0; flex-direction: column; gap: .12rem; }
    .dashboard-identity strong { overflow: hidden; text-overflow: ellipsis; font-size: .85rem; }
    .dashboard-company { color: var(--muted); font-size: .78rem; font-weight: 500; }
    .dashboard-severity { color: var(--accent); font-size: .66rem; font-weight: 750; letter-spacing: .06em; text-align: right; text-transform: uppercase; }
    .dashboard-date { color: var(--muted); font-size: .7rem; }
    .dashboard-chips { display: flex; flex-wrap: wrap; justify-content: end; gap: .25rem; grid-column: 1 / -1; }
    .dashboard-chip { border: 1px solid var(--line); border-radius: 999px; color: var(--muted); padding: .25rem .5rem; font-size: .68rem; }
    .dashboard-chip.accumulation { border-color: #7256a3; color: var(--purple); }
    .dashboard-chip.partial { border-color: #8d5c43; color: var(--orange); }
    .dashboard-chip.exchange { border-color: #3b5a86; color: var(--accent); }
    .row-research-link { color: var(--accent); font-size: .68rem; font-weight: 650; margin-left: auto; }
    .dashboard-empty { padding: 1.5rem; color: var(--muted); }
    .pagination { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin: .6rem 0; padding: .5rem 0; border-top: 1px solid rgba(155, 168, 196, .14); }
    .pagination button { border: 1px solid var(--line); border-radius: 7px; background: #0e162a; color: var(--text); padding: .35rem .7rem; cursor: pointer; }
    .pagination button:disabled { color: var(--muted); cursor: not-allowed; opacity: .5; }
    .pagination-status { color: var(--muted); font-size: .78rem; }
    .segmented { display: inline-flex; padding: .2rem; margin-bottom: 1rem; border: 1px solid var(--line); border-radius: 10px; background: #0e162a; }
    .segmented button { border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; padding: .5rem 1rem; }
    .segmented button[aria-pressed="true"] { background: var(--accent); color: #091126; font-weight: 750; }
    .status { border: 1px solid var(--line); border-radius: 14px; background: rgba(19, 27, 49, .92); overflow: hidden; overflow-wrap: anywhere; }
    .customer-view { padding: clamp(1rem, 1.6vw, 1.4rem); }
    .instrument-heading { display: flex; flex-wrap: wrap; align-items: start; justify-content: space-between; gap: 1rem 1.75rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(155, 168, 196, .16); }
    .instrument-heading h1 { margin: .2rem 0 .15rem; font-size: clamp(1.35rem, 2.6vw, 1.7rem); font-weight: 800; letter-spacing: -.02em; }
    .instrument-meta { margin: 0 0 .5rem; color: var(--muted); font-size: .8rem; }
    .signal-state { margin: 0; color: var(--accent); font-size: .88rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    .state-chips { display: flex; flex-wrap: wrap; justify-content: start; gap: .4rem; margin-top: .55rem; }
    .state-chip { display: inline-flex; border: 1px solid #806a39; border-radius: 999px; color: var(--amber); padding: .32rem .6rem; font-size: .74rem; }
    .state-chip.proxy { border-color: #66528f; color: var(--purple); }
    .state-chip.partial { border-color: #8d5c43; color: var(--orange); }
    .state-chip.historical { border-color: #3b5a86; color: var(--accent); }
    .state-chip.placeholder { border-color: #536a9d; color: #b9caff; }
    .state-chip.accumulation, .state-chip.accumulation-badge { border-color: #7256a3; color: var(--purple); }
    .customer-section { padding-top: 1.4rem; }
    .customer-section h2 { margin-bottom: .85rem; font-size: 1.15rem; letter-spacing: -.02em; }
    .reason-list { display: grid; gap: .6rem; margin: 0; padding: 0; list-style: none; }
    .reason-list li { position: relative; padding: .85rem .85rem .85rem 2.2rem; border-radius: 10px; background: var(--panel-raised); line-height: 1.4; }
    .reason-list li::before { position: absolute; top: .95rem; left: .85rem; width: .6rem; height: .6rem; border-radius: 50%; background: var(--accent); content: ""; }
    .context-note { margin: 1rem 0 0; color: var(--muted); font-size: .86rem; line-height: 1.5; }
    .instrument-identity { min-width: 0; }
    .instrument-company { margin: 0; overflow: hidden; color: rgba(255, 255, 255, .6); font-size: .68rem; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    .instrument-metrics { display: flex; flex-wrap: wrap; gap: .35rem 1.4rem; }
    .instrument-metric { min-width: 4.2rem; }
    .metric-heading { margin: 0 0 .2rem; color: var(--muted); font-size: .6rem; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
    .metric-value { margin: 0; color: var(--text); font-size: 1.02rem; font-weight: 750; }
    .metric-currency { color: var(--gold); font-size: .62rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .metric-cap-value { color: var(--teal); }
    .exchange-primary, .exchange-tier { font-weight: 750; }
    .exchange-lse { color: var(--cyan); }
    .exchange-aim { color: var(--purple); }
    .exchange-main { color: var(--accent); }
    .exchange-other { color: var(--muted); }
    .instrument-context-row { display: flex; flex-wrap: wrap; gap: .3rem 1.2rem; margin-top: .75rem; }
    .context-label { color: var(--accent); font-size: .6rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    .context-value { color: var(--text); font-size: .72rem; font-weight: 650; }
    .instrument-state { margin-top: .85rem; }
    .instrument-state-row { display: flex; align-items: center; flex-wrap: wrap; gap: .55rem; margin-top: .3rem; }
    .chart-card, .research-cards { margin-top: 1.4rem; padding-top: 1.2rem; border-top: 1px solid rgba(155, 168, 196, .16); }
    .chart-card { transition: none; }
    .chart-plot { transition: opacity .15s ease; }
    .chart-plot.chart-range-fade { opacity: 0; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: .8rem; }
    .section-heading h2 { margin: .25rem 0 0; font-size: 1.1rem; }
    .chart-legend { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: .3rem; color: var(--muted); font-size: .7rem; }
    .chart-legend-filter, .chart-legend-reset { display: inline-flex; align-items: center; gap: .2rem; border: 1px solid transparent; border-radius: 999px; background: transparent; color: var(--muted); padding: .2rem .3rem; font-size: .68rem; cursor: pointer; }
    .chart-legend-filter.active { border-color: rgba(121, 169, 255, .35); color: var(--text); }
    .chart-legend-filter:not(.active) { opacity: .45; }
    .chart-legend-filter .legend-shape { margin-left: 0; }
    .chart-legend-reset { border-color: var(--line); }
    .chart-subtitle { margin: .35rem 0 0; color: var(--muted); font-size: .73rem; }
    .legend-shape { display: inline-block; margin-left: .5rem; font-style: normal; font-size: .85rem; line-height: 1; }
    .legend-shape:first-child { margin-left: 0; }
    .legend-alert { color: var(--high); }
    .legend-accumulation { color: var(--purple); }
    .legend-rns { color: var(--accent); }
    .signal-chart { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: linear-gradient(180deg, rgba(25, 35, 61, .9), rgba(14, 22, 42, .8)); touch-action: none; }
    .signal-chart svg { display: block; width: 100%; min-height: 150px; }
    .chart-gridline { fill: none; stroke: rgba(155, 168, 196, .12); stroke-width: 1; }
    .chart-area { fill: url(#chart-area-gradient); opacity: .22; }
    .chart-ranges { display: flex; gap: .35rem; margin: .7rem 0; }
    .chart-range { border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); padding: .28rem .55rem; font-size: .68rem; cursor: pointer; }
    .chart-range.active, .chart-range:hover { border-color: var(--accent); color: var(--text); background: rgba(112, 195, 255, .1); }
    .rns-evidence { margin-top: .55rem; border-top: 1px solid var(--line); padding-top: .5rem; }
    .rns-evidence summary { color: var(--accent); cursor: pointer; font-size: .76rem; }
    .rns-meta { margin-top: .45rem !important; font-size: .7rem !important; }
    .rns-content { max-height: 12rem; overflow: auto; margin-top: .45rem; white-space: pre-wrap; color: var(--text); font-size: .75rem; line-height: 1.5; }
    .chart-line { fill: none; stroke: var(--accent); stroke-linecap: round; stroke-width: 3; }
    .chart-signal-marker { fill: var(--high); stroke: #fff; stroke-width: 2; }
    .chart-signal-marker.historical { opacity: .68; }
    .chart-signal-marker.current { stroke-width: 3; r: 7px; }
    polygon.chart-signal-marker.historical { stroke-width: 2; }
    .chart-rns-marker { fill: var(--accent); stroke: #fff; stroke-width: 1.5; }
    .chart-accumulation-marker { fill: transparent; stroke: var(--purple); stroke-width: 3; r: 8px; }
    .severity-marker-close-watch { fill: var(--close-watch); }
    .severity-marker-elevated { fill: var(--elevated); }
    .severity-marker-high { fill: var(--high); }
    .severity-marker-extreme-caution { fill: var(--extreme); }
    .chart-signal-marker:focus-visible, .chart-accumulation-marker:focus-visible, .chart-rns-marker:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .chart-axis-label { fill: var(--muted); font-size: 9px; }
    .chart-accessibility-note { position: absolute; left: .7rem; bottom: .45rem; color: var(--muted); font-size: .65rem; }
    .chart-note { margin: .65rem 0 0; color: var(--muted); font-size: .76rem; line-height: 1.4; }
    .chart-point-hit { fill: transparent; stroke: transparent; pointer-events: none; }
    .chart-scrub-target { fill: transparent; cursor: crosshair; pointer-events: all; touch-action: none; }
    .chart-crosshair { stroke: rgba(155, 168, 196, .55); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; }
    .chart-crosshair-point { fill: var(--text); stroke: var(--accent); stroke-width: 2; pointer-events: none; }
    .chart-inspection { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem .75rem; margin-bottom: .6rem; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 8px; background: rgba(19, 27, 49, .6); }
    .inspection-date { margin: 0; color: var(--muted); font-size: .74rem; }
    .inspection-price { margin: 0; color: var(--text); font-size: .95rem; font-weight: 750; }
    .inspection-context { display: flex; align-items: baseline; gap: .25rem .6rem; width: 100%; min-height: 1rem; overflow: hidden; white-space: nowrap; }
    .inspection-context:empty { visibility: hidden; }
    .inspection-context p { flex: 0 0 auto; min-width: 0; max-width: 100%; margin: 0; overflow: hidden; text-overflow: ellipsis; font-size: .72rem; white-space: nowrap; }
    .inspection-alert { font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
    .inspection-alert.severity-close-watch { color: var(--close-watch); }
    .inspection-alert.severity-elevated { color: var(--elevated); }
    .inspection-alert.severity-high { color: var(--high); }
    .inspection-alert.severity-extreme-caution { color: var(--extreme); }
    .inspection-activity, .inspection-rns-session { color: var(--muted); }
    .inspection-signal-type, .inspection-price-context { color: var(--text); }
    .inspection-accumulation { color: var(--purple); font-weight: 650; }
    .accumulation-helper { color: var(--purple); font-size: .7rem; }
    .inspection-rns { color: var(--accent); }
    .inspection-rns-headline { color: var(--text); }
    .inspection-rns-link { font-weight: 650; }
    .inspection-rns-headline { overflow: hidden; text-overflow: ellipsis; }
    .alert-history { margin-top: 1.2rem; padding-top: 1rem; border-top: 1px solid rgba(155, 168, 196, .16); }
    .alert-history ol { display: grid; gap: .35rem; margin: 0; padding: 0; list-style: none; }
    .alert-history-row { display: flex; align-items: center; flex-wrap: wrap; gap: .45rem .7rem; padding: .55rem .65rem; border-left: 3px solid var(--line); background: var(--panel-raised); font-size: .74rem; }
    .alert-history-row time { color: var(--muted); min-width: 7.5rem; }
    .alert-history-severity { font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .alert-history-severity.severity-close-watch { color: var(--close-watch); }
    .alert-history-severity.severity-elevated { color: var(--elevated); }
    .alert-history-severity.severity-high { color: var(--high); }
    .alert-history-severity.severity-extreme-caution { color: var(--extreme); }
    .alert-history-activity { color: var(--muted); }
    .alert-history-more { margin-top: .45rem; }
    .alert-history-more summary { display: inline-flex; list-style: none; color: var(--accent); font-size: .76rem; font-weight: 650; cursor: pointer; }
    .alert-history-more summary::-webkit-details-marker, .alert-history-more summary::marker { display: none; content: ""; }
    .alert-history-more .alert-history-collapse { display: none; }
    .alert-history-more[open] .alert-history-show-all { display: none; }
    .alert-history-more[open] .alert-history-collapse { display: inline; }
    .alert-history-more .alert-history-hidden { margin-top: .5rem; }
    .chart-plot .chart-line, .chart-plot .chart-area, .chart-plot .chart-signal-marker, .chart-plot .chart-accumulation-marker, .chart-plot .chart-rns-marker { transition: opacity .32s ease, transform .32s ease; }

    .chart-legend .severity-marker-elevated { color: var(--elevated); }
    .chart-legend .severity-marker-high { color: var(--high); }
    .chart-legend .severity-marker-extreme-caution { color: var(--extreme); }
    .research-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .65rem; }
    .research-cards .section-heading { grid-column: 1 / -1; margin-bottom: 0; }
    .research-card { padding: .85rem; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-raised); }
    /* Company in 30 Seconds: green here is component identity/company
     * context only -- never a bullish/positive-severity signal. Body text
     * stays normal light/white; only the border, heading, and number use
     * the restrained green accent. */
